<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>Сборщик лидов — ниша бронирования</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <h1>Сборщик лидов</h1>
  <span class="city" id="cityLabel">—</span>
  <span class="spacer"></span>
  <button id="btnAdd">+ Объект</button>
  <button id="btnMenu" class="burger" aria-label="Меню" title="Меню">☰</button>
</header>

<!-- Боковое меню: редкие действия убраны сюда, чтобы шапка не рябила -->
<div class="menuback" id="menuBack" hidden></div>
<nav class="menu" id="menu" hidden>
  <div class="menuhead">
    <span class="who" id="who"></span>
    <button id="menuClose" aria-label="Закрыть">✕</button>
  </div>
  <a class="menuitem" href="/refs">Референсы</a>
  <button class="menuitem" id="btnRun">Запустить сбор</button>
  <button class="menuitem" id="btnImport">Импорт CSV</button>
  <button class="menuitem" id="btnExport">Выгрузить в CSV</button>
  <div class="menusep"></div>
  <button class="menuitem" id="btnLogout">Выйти</button>
</nav>

<div class="wrap">

  <div class="runbox" id="runbox">
    <div><b id="runStage">—</b> <span class="muted" id="runCount"></span></div>
    <div class="bar"><i id="runBar"></i></div>
    <div class="log" id="runLog"></div>
  </div>

  <div class="stats" id="stats" hidden></div>

  <div class="filters">
    <button id="btnStats" class="linkbtn" title="Показать или скрыть сводку">
      Сводка
    </button>
    <input type="search" id="q" placeholder="Поиск">
    <select id="fReason"><option value="">Все признаки</option></select>
    <select id="fCategory"><option value="">Все типы</option></select>
    <select id="fStatus"><option value="">Все статусы</option></select>
    <select id="fHas">
      <option value="">Любые контакты</option>
      <option value="contact">Есть контакт</option>
      <option value="phone">Есть телефон</option>
      <option value="telegram">Есть Telegram</option>
      <option value="vk">Есть ВКонтакте</option>
      <option value="none">Контактов нет</option>
    </select>
    <select id="fHidden">
      <option value="">Без скрытых</option>
      <option value="only">Только скрытые</option>
      <option value="all">Со скрытыми</option>
    </select>
    <select id="fSort">
      <option value="score">По баллу</option>
      <option value="priority">По приоритету</option>
      <option value="new">По дате</option>
      <option value="name">По названию</option>
      <option value="checked">По проверке</option>
    </select>
    <span class="muted" id="count"></span>
  </div>

  <div class="workspace">
    <div class="main">
      <div class="tablebox">
        <table>
          <thead>
            <tr>
              <th>Объект</th>
              <th>Признак</th>
              <th class="num">Мой</th>
              <th class="num">Балл</th>
              <th>Контакты</th>
              <th>Сайт</th>
              <th>Статус</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="empty" id="empty" hidden>Пока пусто. Нажмите «Запустить сбор».</div>
      </div>

      <div class="pager">
        <button id="prev">← Назад</button>
        <span class="muted" id="page"></span>
        <button id="next">Вперёд →</button>
      </div>
    </div>

    <!-- Панель карточки стоит рядом с таблицей, а не поверх неё:
         пока лид не выбран, здесь просто пустое место. -->
    <aside class="side" id="drawer"></aside>
  </div>
</div>

<dialog id="runDialog">
  <h3 style="margin-top:0">Что собираем</h3>
  <label class="row"><input type="checkbox" id="optOsm" checked> OpenStreetMap — объекты на карте города</label>
  <label class="row"><input type="checkbox" id="optDadata" checked> Сверять с ЕГРЮЛ — статус, ИНН, директор <span class="muted" id="dadataHint"></span></label>
  <label class="row"><input type="checkbox" id="optDiscover"> Искать новые компании в ЕГРЮЛ <span class="muted">(медленно, много лишнего)</span></label>
  <label class="row"><input type="checkbox" id="optWhois"> Проверять домены через whois <span class="muted">(медленно)</span></label>
  <label class="row"><input type="checkbox" id="optCache" checked> Использовать кеш карты (сутки)</label>
  <div style="display:flex;gap:8px;align-items:center;margin-top:16px">
    <button id="runRescore" title="Применить новые веса из scoring.py к уже собранным лидам">
      Только пересчитать баллы
    </button>
    <span class="spacer" style="flex:1"></span>
    <button id="runCancel">Отмена</button>
    <button id="runGo" class="primary">Поехали</button>
  </div>
</dialog>

<dialog id="addDialog">
  <h3 style="margin-top:0">Новый объект</h3>
  <div class="err" id="addErr"></div>

  <label class="fld"><span>Название *</span>
    <input type="text" id="addName" placeholder="Баня на Уктусе" autocomplete="off"></label>

  <label class="fld"><span>Сайт</span>
    <input type="text" id="addSite" placeholder="example.ru" autocomplete="off"></label>

  <label class="fld"><span>Телефон</span>
    <input type="text" id="addPhone" placeholder="+7 343 000-00-00" autocomplete="off"></label>

  <div class="fldrow">
    <label class="fld"><span>Telegram</span>
      <input type="text" id="addTg" placeholder="username" autocomplete="off"></label>
    <label class="fld"><span>ВКонтакте</span>
      <input type="text" id="addVk" placeholder="club123" autocomplete="off"></label>
  </div>

  <label class="fld"><span>Категория</span>
    <input type="text" id="addCat" list="catList" placeholder="Баня / сауна" autocomplete="off">
    <datalist id="catList"></datalist></label>

  <label class="fld"><span>Адрес</span>
    <input type="text" id="addAddr" placeholder="Екатеринбург, улица Ленина 1" autocomplete="off"></label>

  <label class="fld"><span>Заметка</span>
    <textarea id="addNote" style="min-height:60px" placeholder="Откуда узнали, что важно"></textarea></label>

  <div class="muted" style="font-size:12px;margin-top:4px">
    Сайт сразу проверится, а компания сверится с ЕГРЮЛ — это занимает несколько секунд.
  </div>

  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
    <button id="addCancel">Отмена</button>
    <button id="addGo" class="primary">Добавить</button>
  </div>
</dialog>

<input type="file" id="fileInput" accept=".csv" hidden>

<script src="/static/app.js"></script>
</body>
</html>
