<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>Рабочее время — сборщик лидов</title>
  <!-- Иконки Аркадия. favicon-16/32 нарисованы под реальный размер вкладки —
       браузерное уменьшение 512-го даёт тёмные ореолы вокруг буквы.
       apple-touch-icon айфон берёт при добавлении на главный экран и скругляет
       сам, поэтому файл квадратный и без прозрачности. -->
  <link rel="icon" type="image/png" sizes="16x16" href="/static/icons/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/favicon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/static/icons/favicon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#0e0e10">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <h1>Рабочее время</h1>
  <span class="city">кто когда работал с базой</span>
  <span class="spacer"></span>
  <a class="btn" href="/history">Журнал изменений</a>
  <a class="btn" href="/">← К лидам</a>
</header>

<div class="wrap">

  <div class="filters">
    <select id="fPerson"><option value="">Все сотрудники</option></select>
    <select id="fDays">
      <option value="7">7 дней</option>
      <option value="14" selected>14 дней</option>
      <option value="30">30 дней</option>
      <option value="90">90 дней</option>
    </select>
    <span class="muted" id="range"></span>
  </div>

  <div id="body"><div class="empty">Загружаем…</div></div>

</div>

<script src="/static/heartbeat.js"></script>
<script src="/static/activity.js"></script>
</body>
</html>
