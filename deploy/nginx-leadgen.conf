# Конфиг leadgen.kahman.studio.
#
# Собран по той же схеме, что и основной сайт: TLS-настройки внутри
# server-блоков, а не общим куском сверху — файлы из sites-enabled
# подключаются внутрь секции http, где эти директивы уже заданы,
# и второе объявление на том же уровне даёт ошибку «is duplicate».
#
# Ставить ПОСЛЕ выпуска сертификата: без файлов сертификата nginx не стартует.
# Порядок — в deploy/bootstrap.sh.

# --- HTTP: продление сертификата и переезд на HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name leadgen.kahman.studio;

    # Проверка Let's Encrypt ходит сюда и не должна попадать под редирект
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/leadgen;
        default_type "text/plain";
    }

    location / {
        return 301 https://leadgen.kahman.studio$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name leadgen.kahman.studio;

    ssl_certificate /etc/letsencrypt/live/leadgen.kahman.studio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/leadgen.kahman.studio/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Вход теперь внутри приложения: своя страница логина и сессии,
    # пользователи заводятся в LEADGEN_USERS. Всплывающее окно nginx
    # (auth_basic) убрано намеренно — оно и было той самой формой.

    # Поисковикам тут делать нечего. robots.txt отдаёт само приложение,
    # заголовок дублирует запрет на случай, если робот его проигнорирует.
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Импорт CSV — файлы небольшие, но запас не мешает
    client_max_body_size 20m;

    access_log /var/log/nginx/leadgen.access.log;
    error_log  /var/log/nginx/leadgen.error.log;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Выгрузка большого CSV и старт сбора могут отвечать не мгновенно
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
