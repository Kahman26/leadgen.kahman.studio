name: Деплой на сервер

# Пуш в main — и сервер обновляется сам.
# Ручной запуск доступен во вкладке Actions (workflow_dispatch).
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

# Два деплоя одновременно не нужны: второй дождётся первого.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Подготовить SSH-ключ
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Выполнить деплой
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o ConnectTimeout=20 \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              'bash -s' < deploy/deploy.sh

      - name: Убрать ключ
        if: always()
        run: rm -f ~/.ssh/deploy_key
